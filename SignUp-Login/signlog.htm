<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Login & Signup</title>

  <link rel="stylesheet" href="signlog.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>

 <div class="navbar">
    <div class="logo">
     <img src="/assetss/removebg-preview.png" alt="Swaraj Builders Logo" style="height: 60px;">
      </div>
       <div><h6>Swaraj Builders</h6></div>
         
     <div class="containerr">
       <div class="menu-icon"><i class="fa fa-bars"></i></div>
        <div class="navpart2"> 
        <a href="../index.html">Home</a>
        <a href="../AboutUs.htm">About</a>
         <a href="../properties/index.html">Properties</a>
        <a href="../Sites.htm">Sites</a>
        <a href="../Gallery.htm">Gallery</a>
        <a href="../Contact.htm">Contact</a>
        <a href="../SignUp-Login/signlog.htm">SignIn</a>
       </div>
     </div>
    </div> 
<div class="container">

  <!-- SIGN UP -->
  <div class="form-container sign-up-container">
    <form id="signup-form"  method="GET">

      <h1>Create Account</h1>

   

      <span class="divider">OR</span>

      <input type="text" name="name" placeholder="Name" required />

      <input type="email" name="email" placeholder="Email" required />

      <div class="password-wrapper">
        <input type="password" name="password" placeholder="Password" id="signup-password" required />
        <span class="toggle-password" onclick="togglePassword('signup-password')">&#128065;</span>
      </div>

      <button  class="SignUpbtn" type="submit">Sign Up</button>
    </form>
  </div>

  <!-- SIGN IN -->
  <div class="form-container sign-in-container">
    <form id="login-form"  method="GET">

      <h1>Sign In</h1>

     

    

      <input type="email" name="email" placeholder="Email" required />

      <div class="password-wrapper">
        <input type="password" name="password" placeholder="Password" id="login-password" required />
        <span class="toggle-password" onclick="togglePassword('login-password')">&#128065;</span>
      </div>

      <button type="submit">Sign In</button>
    </form>
  </div>

  <!-- OVERLAY -->
  <div class="overlay-container">
    <div class="overlay">

      <div class="overlay-panel overlay-left">
        <h1>Welcome Back!</h1>
        <p>To keep connected with us please login with your personal info</p>
        <button class="ghost" id="signIn">Sign In</button>
      </div>

      <div class="overlay-panel overlay-right">
        <h1>Hello,</h1>
        <p>Enter your details and start your journey with us</p>
        <button class="ghost" id="signUp">Sign Up</button>
      </div>

    </div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/split-type"></script>
<script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.2.2/dist/locomotive-scroll.min.js"></script>
<script src="signlog.js"></script>
</body>
</html>
