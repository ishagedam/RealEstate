   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

   <link rel="stylesheet" href="/footer/footer.css">

</head>
<body>

 <div class="navbar">
    <div class="logo">
     <img src="/assetss/removebg-preview.png" alt="Swaraj Builders Logo" style="height: 60px;">
      </div>
       <div><h6>Swaraj Builders</h6></div>
         
     <div class="containerr">
       <div class="menu-icon"><i class="fa fa-bars"></i></div>
        <div class="navpart2"> 
        <a href="../index.html">Home</a>
        <a href="../AboutUs.htm">About</a>
         <a href="../properties/property.htm">Properties</a>

       </div>
     </div>
    </div>
    





<div class="container" id="container">
    <!-- SIGN UP -->
    <div class="form-container sign-up-container">
        <form id="signup-form">
            <h1>Create Account</h1>
            <input type="text" name="name" placeholder="Name" required />
            <input type="email" name="email" placeholder="Email" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">Sign Up</button>
            <!-- He mobile sathi toggle aahe -->
            <p class="mobile-toggle">Already have an account? <b id="signInMobile">Sign In</b></p>
        </form>
    </div>

    <!-- SIGN IN -->
    <div class="form-container sign-in-container">
        <form id="login-form">
            <h1>Sign In</h1>
            <input type="email" name="email" placeholder="Email" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">Sign In</button>
            <!-- He mobile sathi toggle aahe -->
            <p class="mobile-toggle">Don't have an account? <b id="signUpMobile">Sign Up</b></p>
        </form>
    </div>

    <!-- OVERLAY (Fakt Desktop var disel) -->
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1>
                <button class="ghost" id="signIn">Sign In</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>Hello,</h1>
                <p>Join us and explore your dream property</p>
                <button class="ghost" id="signUp">Sign Up</button>
            </div>
        </div>

    </div>
            
</div>

<div id="footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/split-type"></script>
<script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.2.2/dist/locomotive-scroll.min.js"></script>
<script src="../footer/footer.js"></script>
<script src="signlog.js"></script>
</body>
</html>
