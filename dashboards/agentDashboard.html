
 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agent Dashboard</title>
  <link rel="stylesheet" href="./agent.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
</head>
<body>

<div class="dashboard-wrapper">
  <aside id="leftPanel">
    <div class="brand">
     
        <div class="logo">
     <img src="/assetss/removebg-preview.png" alt="Swaraj Builders Logo" style="height: 60px;">
      </div>
      <span>Swaraj Builders</span>
    </div>

    <div id="PropertyManagement" class="nav-group">
      <h3><i class="fa-solid fa-building"></i> Property Management</h3>
      <button id="addPropertyBtn"><i class="fa-solid fa-plus"></i> Add New Property</button><br>
      <button id="viewMyPropertyBtn"><i class="fa-solid fa-list"></i> View My Properties</button>
    </div>
<br>
    <div id="myPropertyContainer" class="nav-group">
      <h3><i class="fa-solid fa-comments"></i> Client Interaction</h3>
       <button id="viewEnquiryBtn"> <i class="fa-solid fa-comments"></i> View Enquiries</button>


      <div id="modalContainer"></div>
    </div>

    <div class="nav-group footer-nav">
        <div id="viewProfileBtn">
            <button id="viewProfileBtn"><i class="fa-solid fa-user-gear"></i> View Profile</button> <br>
        </div>
        <div>
        <button id="logoutBtn" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button> <br>
      <button id="homebtns"><a href="/index.html"> <i class="fa-solid fa-house" style="color: rgb(229, 234, 234);"></i>  Home</a></button> </div>
    </div>
  </aside>

  <main class="main-content">
    <header id="header">
       <h1 id="welcomeText">Welcome! Agent Dashboard</h1>
      <div class="header-tools">
      </div>
    
    </header>


    
<div class="rs-sidebar">
    <div class="rs-card clock-card">
        <div id="rs-time">00:00:00</div>
        <div id="rs-day">Loading...</div>
    </div>

    <div class="rs-card cal-card">
        <div class="cal-header" id="rs-month-year">Month Year</div>
        <div class="cal-grid labels">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div id="rs-calendar-days" class="cal-grid days"></div>
    </div>
</div>





    <div class="content-card">
   
      
      <div class="enquiry-card" style="display: none;" >
        <h2>My Enquiries</h2>
      <div id="enquiryContainer" style="display: none;"></div></div>

        <div id="profileModalContainer"></div>
    </div>

    <div id="addPropertyModal" class="modal-overlay" style="display:none;">
      <div class="modal-content">
        <div class="modal-header">
            <h3>Add New Property</h3>
   
            <button id="closeModalBtn">&times;</button>
        </div>
        
        <form id="addPropertyForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" name="title" placeholder="E.g. Modern Suburban Villa" required>
                </div>
                <div class="form-group">
                    <label>Type:</label>
                    <select name="type" required>
                        <option value="">Select Type</option>
                        <option value="Flat">Flat</option>
                        <option value="House">House</option>
                        <option value="Villa">Villa</option>
                        <option value="Land">Land</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>City:</label>
                    <input type="text" name="city" required>
                </div>
                <div class="form-group">
                    <label>Price ($):</label>
                    <input type="number" name="price" step="0.01" required>
                </div>
                <div class="form-group full-width">
                    <label>Image URL:</label>
                    <input type="text" name="image">
                </div>
                <div class="form-group">
                    <label>Floor Info:</label>
                    <input type="text" name="floor" placeholder="">
                </div>
                <div class="form-group">
                    <label>Property Status:</label>
                    <select name="property_status">
                        <option value="">Select Status</option>
                        <option value="Ready">Ready</option>
                        <option value="Under Construction">Under Construction</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Listing Visibility:</label>
                    <select name="status">
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <!-- <label>Features (Comma separated):</label>
                    <textarea name="features" rows="2"></textarea> -->



                    <!-- ================================== -->
  <label>Features</label>
      <div class="checkbox-group">
         <label><input type="checkbox" name="feature" value=" Smart Home"> Smart Home</label>
         <label><input type="checkbox" name="feature" value="Modular Kitchen"> Modular Kitchen</label>
         <label><input type="checkbox" name="feature" value="Balcony"> Balcony</label>
         <label><input type="checkbox" name="feature" value="Vastu Compliant"> Vastu Compliant</label>
        <label><input type="checkbox" name="feature" value="Italian Marble"> Italian Marble</label>
 
      </div>

<!-- ===================================================== -->


                </div>
                 <div class="form-group full-width">
                    <label>Description:</label>
                    <textarea name="description" rows="3"></textarea>
                </div>
                <div class="form-group full-width">
                <!-- ================================= -->
                        
       <label>Amenities</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="amenity" value="Infinity Pool">Infinity Pool</label>
        <label><input type="checkbox" name="amenity" value="Gym">24/7 Security</label>
        <label><input type="checkbox" name="amenity" value="Club House & Gym">Clubhouse & Gym</label>
        <label><input type="checkbox" name="amenity" value="Parking"> Parking</label>
        <label><input type="checkbox" name="amenity" value="Zen Garden">Zen Garden</label>
 
      </div> 
             <!-- ====================== -->  
                </div>
            </div>
            <button type="submit" class="save-btn">List Property</button>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="./agent.js"></script>

</body>
</html>
